name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Verificar conteúdo do jar
        run: |
          jar=$(ls build/libs/*.jar | head -n1)
          echo "Jar: $jar"
          unzip -l "$jar"
          unzip -l "$jar" | grep -q "META-INF/neoforge.mods.toml" || { echo "ERRO: falta META-INF/neoforge.mods.toml no jar"; exit 1; }
          unzip -l "$jar" | grep -q "com/pocketring/PocketRing.class" || { echo "ERRO: falta PocketRing.class no jar"; exit 1; }

      - name: Enviar .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pocketring
          path: build/libs/*.jar

      - name: Criar release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
